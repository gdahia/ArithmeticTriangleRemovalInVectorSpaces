# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
  description: >-
    Lean 4 formalisation of the main results of Jacob Fox and László Miklós Lovász, A tight bound
    for Green's arithmetic triangle removal lemma in vector spaces (arXiv:1606.01230): the
    arithmetic triangle removal lemma in F_p^n with a polynomial bound (Theorem 1), the
    Kleinberg–Sawin–Speyer bound on multicolored sum-free families (Theorem 2), the count of
    triangles spanned by vertex-disjoint triangles (Theorem 3), and the tightness of the exponent
    in Theorem 1 (the second part of Theorem 1).
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B30", "05D40", "11T99"]

sources:
  - title: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
    authors:
      - "Jacob Fox"
      - "László Miklós Lovász"
    id: "arXiv:1606.01230"
    type: "paper"
    location: "Theorems 1, 2 and 3, and Section 3"
    relationship: "formalizes"
    note: >-
      The project follows the proof of the paper, with two changes of method. The sets are
      intersected with the kernel of a uniformly random linear map instead of a uniformly random
      subspace. Vertices of large degree are not removed one at a time: a single choice of
      subsets minimizing a potential gives Theorem 3 up to a constant factor, and the product
      argument of the paper removes the constant factor. The second part of Theorem 1 follows
      the construction of Section 3, with the large multicolored sum-free families that the paper
      takes from Kleinberg, Sawin and Speyer, Norin and Pebody. These families are constructed
      following Kleinberg, Sawin and Speyer and Pebody; see those sources.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The growth rate of tri-colored sum-free sets"
    authors:
      - "Robert Kleinberg"
      - "Will Sawin"
      - "David E. Speyer"
    id: "arXiv:1607.00047"
    type: "paper"
    location: "The upper bound on multicolored sum-free sets, Lemma 3.1 and Section 4"
    relationship: "adapts"
    note: >-
      Theorem 2 of Fox and Lovász is cited from this paper. For the upper bound, the Lean proof
      writes the indicator of u + v + w = 0 in F_p^n as a sum of products of monomials of degree
      at most (p - 1)n, bounds the slice rank of the diagonal tensor by Tao's lemma, counts the
      monomials of degree at most (p - 1)n/3 by Chernoff's bound with a parameter 0 < x < 1, and
      removes the constant factor by taking tensor powers. For the large multicolored sum-free
      families used in the second part of Theorem 1 of Fox and Lovász, it follows the
      construction of Section 4: a coupling of three geometric distributions of mean (p - 1)/3,
      given by Pebody's theorem, is rounded to a base point; the triples of the type classes of
      its coordinates summing to the all p - 1 vector are hashed into Z/PZ for a prime P from
      Bertrand's postulate, and the triples whose hashes lie in a set without three-term
      progressions from Behrend's construction and share no vector with another such triple
      form the family. The size of a type class is bounded below as in Lemma 3.1, by comparing
      it with the cross entropy of the geometric distribution and a Stirling bound.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Proof of a conjecture of Kleinberg, Sawin and Speyer"
    authors:
      - "Luke Pebody"
    id: "arXiv:1608.05740"
    type: "paper"
    location: "Theorem 4, Lemma 2.1, Lemma 3.1, Corollary 3.2 and Section 5"
    relationship: "formalizes"
    note: >-
      Pebody's theorem says that three decreasing mass functions on [0, N] with equal masses
      whose means sum to N are the marginals of a nonnegative function on the triples of natural
      numbers with sum N. The Lean proof follows Pebody's induction on N: decreasing mass
      functions are nonnegative combinations of uniform distributions, balanced weights
      decompose into simple triples, and the simple triples are handled by peeling off the layer
      where the first variable vanishes or by the case analysis of Section 5.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A symmetric formulation of the Croot-Lev-Pach-Ellenberg-Gijswijt capset bound"
    authors:
      - "Terence Tao"
    id: "https://terrytao.wordpress.com/2016/05/18/a-symmetric-formulation-of-the-croot-lev-pach-ellenberg-gijswijt-capset-bound/"
    type: "web post"
    location: "Lemmas 1 and 2"
    relationship: "adapts"
    note: >-
      The upper bound on multicolored sum-free families is proved in the slice rank language of
      this post. Lemma 1, that a diagonal tensor with nonzero diagonal has slice rank equal to the
      size of its index set, is proved in the form of a lower bound, by finding a vector with
      many nonzero coordinates in a subspace of large dimension. Lemma 2 is adapted to F_p^n by
      bounding the slice rank of the indicator of u + v + w = 0 by three times the number of
      monomials of degree at most (p - 1)n/3.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets, ZMod p, Fintype.card, Real.rpow and Real.logb from
      Mathlib. The proofs use its multivariate polynomials, matrix rank, linear maps between
      finite vector spaces, Jensen's inequality for concave functions, the weighted
      arithmetic-geometric mean inequality, and double counting. Mathlib has none of the
      theorems of the sources.

status:
  scope: >-
    The project proves Theorems 1, 2 and 3 of Fox and Lovász in Fin n → ZMod p, including the
    second part of Theorem 1. The sorry counts refer to the library and
    ArithmeticTriangleRemovalInVectorSpacesPalomar/Solution.lean;
    ArithmeticTriangleRemovalInVectorSpacesPalomar/Challenge.lean has four placeholders, one for
    each statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib and a shell. The agent read the LaTeX source of the paper, wrote the
        definitions, the statements and the proofs, checked them with the Lean compiler, and
        wrote Challenge.lean, Solution.lean, the README and this file.
      cost:
        wall_time: "three sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        Six instructions in turn. The first asked the agent to formalize the main results of the
        paper for submission to Palomar, following the maintainer's Lean style guide. The second
        asked it to review the project against the maintainer's Lean and Palomar standards and fix
        what the review found, the third to put the second part of Theorem 1 back into
        Challenge.lean, and the fourth to align this file with the maintainer's edits to the
        README. The fifth asked it to make the bound ε₀ of the second part of Theorem 1, and the
        dimension n₀ from which on the large multicolored sum-free families exist, explicit in p
        and η, and the sixth to restyle and refactor the new proofs.
  spend_usd: "not tracked"
  notes: >-
    Claude Code wrote the Lean code, the README and this file at the request of Gabriel Dahia.
    The agent chose the random linear map and the potential minimization. In the review, it
    restyled the library, with subagents working on separate directories, reduced Challenge.lean
    to the main results chosen by the maintainer, and wrote the triangles and multicolored
    sum-freeness in its statements in terms of Mathlib definitions. It then added the second part
    of Theorem 1 back to Challenge.lean in the same form. After the maintainer shortened the
    README and removed two statements from Challenge.lean and Solution.lean, the agent updated
    this file, comparator.json and the remaining references in the README and Challenge.lean to
    match. To make ε₀ and n₀ explicit, the agent placed the parameter ρ of the geometric
    distribution of Kleinberg, Sawin and Speyer in [1/2, 1), which bounds the error terms of the
    type class estimate by explicit functions of p, and stated both thresholds as definitions,
    which Challenge.lean repeats. In the restyle, the maintainer chose to keep the definitions
    under the names n₀ and ε₀, and the agent split the new proofs into lemmas on the error term of
    the type class estimate and on the real inequalities satisfied by η'. Every proof is checked
    by Lean.

fidelity:
  divergences: >-
    Theorem 1 assumes 0 ≤ ε in place of 0 < ε < 1, and bounds the number of removed elements by
    εN. Theorem 3 allows X, Y and Z to contain more than the vertices of the m triangles, which
    are given as injective functions x, y and z from a finite type with x i + y i + z i = 0. The
    bound δ ≤ ε^(C_p - o(1)) of the second part of Theorem 1 is stated as: for every η > 0 and
    0 < ε < ε₀, any δ that works with ε in the removal lemma for every n satisfies
    δ ≤ ε^(C_p - η), where ε₀ = p^(-(n₀ + 1)) with n₀ = ⌈(2^(p+3) p^10 / η')^2⌉ + p^4 + 1 and
    η' = c_p min(1 - c_p, c_p η / 2) / 2. The paper does not make ε₀ explicit.

review:
  status: "self-assessed"
  reviewers:
    - "Gabriel Dahia"
  notes: >-
    Gabriel Dahia checked the main statements in Challenge.lean against the paper for
    correctness, and reviewed the statements and the style of the parts of the library that prove
    the upper bounds, Theorems 1, 2 and 3. The construction behind the second part of Theorem 1,
    including Pebody's coupling, has not been reviewed beyond the Lean check.

alignment:
  namespace: "ArithmeticTriangleRemovalInVectorSpaces"
  statements:
    - source: "Fox and Lovász, Theorem 1"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.exists_subset_card_sdiff_add_le_forall_add_ne_zero'"
      module: "ArithmeticTriangleRemovalInVectorSpacesPalomar.Challenge"
      status: "proved"
      note: "Proved as ArithmeticTriangleRemovalInVectorSpaces.exists_subset_card_sdiff_add_le_forall_add_ne_zero in ArithmeticTriangleRemovalInVectorSpaces.ZMod."
    - source: "Fox and Lovász, Theorem 2 (Kleinberg, Sawin and Speyer)"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.card_le_rpow_one_sub_c_mul'"
      module: "ArithmeticTriangleRemovalInVectorSpacesPalomar.Challenge"
      status: "proved"
      note: "Proved as ArithmeticTriangleRemovalInVectorSpaces.card_le_rpow_one_sub_c_mul in ArithmeticTriangleRemovalInVectorSpaces.ZMod."
    - source: "Fox and Lovász, Theorem 3"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.div_pow_rpow_C_mul_sq_le_card_triangles'"
      module: "ArithmeticTriangleRemovalInVectorSpacesPalomar.Challenge"
      status: "proved"
      note: "Proved as ArithmeticTriangleRemovalInVectorSpaces.div_pow_rpow_C_mul_sq_le_card_triangles in ArithmeticTriangleRemovalInVectorSpaces.ZMod."
    - source: "Fox and Lovász, Theorem 1, second part, δ ≤ ε^(C_p - o(1)), as derived in Section 3"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.le_rpow_C_sub_of_forall_exists_subset'"
      module: "ArithmeticTriangleRemovalInVectorSpacesPalomar.Challenge"
      status: "proved"
      note: "Proved as ArithmeticTriangleRemovalInVectorSpaces.le_rpow_C_sub_of_forall_exists_subset in ArithmeticTriangleRemovalInVectorSpaces.ZMod."
    - source: "The exponent c_p of Kleinberg, Sawin and Speyer"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.c"
      module: "ArithmeticTriangleRemovalInVectorSpaces.MulticoloredSumFree.Exponent"
    - source: "The exponent C_p = 1 + 1/c_p"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.C"
      module: "ArithmeticTriangleRemovalInVectorSpaces.MulticoloredSumFree.Exponent"
    - source: "The dimension n₀ = ⌈(2^(p+3) p^10 / η)^2⌉ + p^4 + 1 in the bound ε₀"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.n₀"
      module: "ArithmeticTriangleRemovalInVectorSpaces.MulticoloredSumFree.Exponent"
    - source: "The bound ε₀ = p^(-(n₀ + 1)) of the second part of Theorem 1"
      lean: "ArithmeticTriangleRemovalInVectorSpaces.ε₀"
      module: "ArithmeticTriangleRemovalInVectorSpaces.MulticoloredSumFree.Exponent"

acknowledgements: "Lean 4 and Mathlib; the Palomar registry template."
