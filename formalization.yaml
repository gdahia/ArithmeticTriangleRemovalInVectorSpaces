# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
  description: >-
    Lean 4 formalization of the main results of Fox and Lovász, A tight bound for Green's
    arithmetic triangle removal lemma in vector spaces (arXiv:1606.01230). For a prime p, the
    exponent c_p of Kleinberg, Sawin and Speyer is defined by
    p^(1 - c_p) = inf over 0 < x < 1 of x^(-(p - 1)/3)(1 + x + ... + x^(p - 1)), and
    C_p = 1 + 1/c_p. The project proves Theorem 1 of the paper: if X, Y, Z ⊆ F_p^n have fewer than
    (ε/3)^(C_p) N² triangles x + y + z = 0, where N = p^n, then removing at most εN elements
    leaves no triangle. It proves Theorem 2, the Kleinberg–Sawin–Speyer bound m ≤ p^((1 - c_p)n)
    for multicolored sum-free families, by the slice rank method, and Theorem 3: m vertex-disjoint
    triangles span at least (m/N)^(C_p) N² triangles. It proves the second part of Theorem 1:
    if the removal lemma holds with ε and δ in every dimension, then δ ≤ ε^(C_p - o(1)) as ε
    tends to 0. It also proves the values
    c_2 = 5/3 - log_2 3 and c_3 = 1 - log b / log 3, where b = a^(-2/3) + a^(1/3) + a^(4/3) and
    a = (√33 - 1)/8.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B30", "05D40", "11T99"]

sources:
  - title: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
    authors:
      - "Jacob Fox"
      - "László Miklós Lovász"
    id: "arXiv:1606.01230"
    type: "paper"
    location: "Theorems 1, 2 and 3, Section 3, and the values of c_2 and c_3 in Section 1"
    relationship: "formalizes"
    note: >-
      The project follows the proof of the paper, with two changes of method. The sets are
      intersected with the kernel of a uniformly random linear map instead of a uniformly random
      subspace. Vertices of large degree are not removed one at a time: a single choice of
      subsets minimizing a potential gives Theorem 3 up to a constant factor, and the product
      argument of the paper removes the constant factor. The second part of Theorem 1 follows
      the construction of Section 3, with the large multicolored sum-free families that the paper
      takes from Kleinberg, Sawin and Speyer, Norin and Pebody. These families are constructed
      following Kleinberg, Sawin and Speyer and Pebody; see those sources. The values of c_2 and
      c_3 follow from the weighted arithmetic-geometric mean inequality.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The growth rate of tri-colored sum-free sets"
    authors:
      - "Robert Kleinberg"
      - "Will Sawin"
      - "David E. Speyer"
    id: "arXiv:1607.00047"
    type: "paper"
    location: "The upper bound on multicolored sum-free sets, Lemma 3.1 and Section 4"
    relationship: "adapts"
    note: >-
      Theorem 2 of Fox and Lovász is cited from this paper. For the upper bound, the Lean proof
      writes the indicator of u + v + w = 0 in F_p^n as a sum of products of monomials of degree
      at most (p - 1)n, bounds the slice rank of the diagonal tensor by Tao's lemma, counts the
      monomials of degree at most (p - 1)n/3 by Chernoff's bound with a parameter 0 < x < 1, and
      removes the constant factor by taking tensor powers. For the large multicolored sum-free
      families used in the second part of Theorem 1 of Fox and Lovász, it follows the
      construction of Section 4: a coupling of three geometric distributions of mean (p - 1)/3,
      given by Pebody's theorem, is rounded to a base point; the triples of the type classes of
      its coordinates summing to the all p - 1 vector are hashed into Z/PZ for a prime P from
      Bertrand's postulate, and the triples whose hashes lie in a set without three-term
      progressions from Behrend's construction and share no vector with another such triple
      form the family. The size of a type class is bounded below as in Lemma 3.1, by comparing
      it with the cross entropy of the geometric distribution and a Stirling bound.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Proof of a conjecture of Kleinberg, Sawin and Speyer"
    authors:
      - "Luke Pebody"
    id: "arXiv:1608.05740"
    type: "paper"
    location: "Theorem 4, Lemma 2.1, Lemma 3.1, Corollary 3.2 and Section 5"
    relationship: "formalizes"
    note: >-
      Pebody's theorem says that three decreasing mass functions on [0, N] with equal masses
      whose means sum to N are the marginals of a nonnegative function on the triples of natural
      numbers with sum N. The Lean proof follows Pebody's induction on N: decreasing mass
      functions are nonnegative combinations of uniform distributions, balanced weights
      decompose into simple triples, and the simple triples are handled by peeling off the layer
      where the first variable vanishes or by the case analysis of Section 5.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets, ZMod p, Fintype.card, Real.rpow, Real.logb and Real.sqrt
      from Mathlib. The proofs use its multivariate polynomials, matrix rank, linear maps between
      finite vector spaces, Jensen's inequality for concave functions, the weighted
      arithmetic-geometric mean inequality, and double counting. Mathlib has none of the
      theorems of the sources.

status:
  scope: >-
    The project proves Theorems 1, 2 and 3 of Fox and Lovász in Fin n → ZMod p, including the
    second part of Theorem 1, and the values of c_2 and c_3. The sorry counts refer to the
    library and ArithmeticTriangleRemovalInVectorSpacesPalomar/Solution.lean;
    ArithmeticTriangleRemovalInVectorSpacesPalomar/Challenge.lean has six placeholders, one for
    each statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib and a shell. The agent read the LaTeX source of the paper, wrote the
        definitions, the statements and the proofs, checked them with the Lean compiler, and
        wrote Challenge.lean, Solution.lean, the README and this file.
      cost:
        wall_time: "two sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        One instruction to formalize the main results of the paper for submission to Palomar,
        following the maintainer's Lean style guide. Later, one instruction to review the project
        against the maintainer's Lean and Palomar standards and fix what the review found.
        Later, one instruction to put the second part of Theorem 1 back into Challenge.lean.
  spend_usd: "not tracked"
  notes: >-
    Claude Code wrote the Lean code, the README and this file at the request of Gabriel Dahia.
    The agent chose the random linear map, the potential minimization and the proofs of the values
    of c_2 and c_3 by the weighted arithmetic-geometric mean inequality. Later, the agent
    restyled the library, with subagents working on separate directories, reduced Challenge.lean
    to the main results chosen by the maintainer, and wrote the triangles and multicolored
    sum-freeness in its statements in terms of Mathlib definitions. Later, the agent added the
    second part of Theorem 1 back to Challenge.lean in the same form. Every proof is checked by
    Lean.

fidelity:
  divergences: >-
    Theorem 1 assumes 0 ≤ ε in place of 0 < ε < 1, and bounds the number of removed elements by
    εN. Theorem 2 indexes the family by a finite type. Theorem 3 allows X, Y and Z to contain more
    than the vertices of the m triangles, which are given as injective functions x, y and z from a
    finite type with x i + y i + z i = 0. The bound δ ≤ ε^(C_p - o(1)) of the second part of
    Theorem 1 is stated as: for every η > 0 there is ε₀ > 0 such that for 0 < ε < ε₀, any δ that
    works with ε in the removal lemma for every n satisfies δ ≤ ε^(C_p - η). The value of c_3 is stated for any a with
    a = (√33 - 1)/8, and logarithms are natural logarithms, as their ratio does not depend on the
    base.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

