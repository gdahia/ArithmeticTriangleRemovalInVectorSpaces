# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
  description: >-
    Lean 4 formalization of the main results of Fox and Lovász, A tight bound for Green's
    arithmetic triangle removal lemma in vector spaces (arXiv:1606.01230). For a prime p, the
    exponent c_p of Kleinberg, Sawin and Speyer is defined by
    p^(1 - c_p) = inf over 0 < x < 1 of x^(-(p - 1)/3)(1 + x + ... + x^(p - 1)), and
    C_p = 1 + 1/c_p. The project proves Theorem 1 of the paper: if X, Y, Z ⊆ F_p^n have fewer than
    (ε/3)^(C_p) N² triangles x + y + z = 0, where N = p^n, then removing at most εN elements
    leaves no triangle. It proves Theorem 2, the Kleinberg–Sawin–Speyer bound m ≤ p^((1 - c_p)n)
    for multicolored sum-free families, by the slice rank method, and Theorem 3: m vertex-disjoint
    triangles span at least (m/N)^(C_p) N² triangles. Theorems 1, 2 and 3 are also proved in every
    finite vector space over F_p. For the tightness part of Theorem 1 it proves the construction
    of Section 3 of the paper and the inequality it gives: if the removal lemma holds with ε and
    δ, then every multicolored sum-free family of more than εN triples has at least δN²
    members. It proves the second part of Theorem 2, which the paper cites from Kleinberg, Sawin
    and Speyer with Pebody: for every η > 0 and every large n there is a multicolored sum-free
    family of at least p^((1 - c_p - η)n) triples. From the two it derives the bound
    δ ≤ ε^(C_p - o(1)) of Section 3. It also proves the values c_2 = 5/3 - log_2 3 and
    c_3 = 1 - log b / log 3, where b = a^(-2/3) + a^(1/3) + a^(4/3) and a = (√33 - 1)/8.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B30", "05D40", "11T99"]

sources:
  - title: "A tight bound for Green's arithmetic triangle removal lemma in vector spaces"
    authors:
      - "Jacob Fox"
      - "László Miklós Lovász"
    id: "arXiv:1606.01230"
    type: "paper"
    location: "Theorems 1, 2 and 3, Lemma 5, Section 3, and the values of c_2 and c_3 in Section 1"
    relationship: "formalizes"
    note: >-
      The project follows the structure of the paper: Theorem 1 from Theorem 3 through a maximal
      family of vertex-disjoint triangles, Theorem 3 from Lemma 5, the embedding of
      F_p^n into F_p^(n+2) and a product argument, and the construction of Section 3. It
      departs from the paper in three places. Lemma 5 intersects the sets with the kernel of a
      uniformly random linear map instead of a uniformly random subspace, and holds for every
      degree bound ρ. Lemma 6 and Theorem 4, which remove vertices of large degree one at a time
      and give the exponent C_p + o(1), are replaced by a single choice of subsets minimizing a
      potential, which gives Theorem 3 up to a constant factor; the product argument then removes
      the constant factor. The paper's lower bound on the size of multicolored sum-free families,
      which it takes from Kleinberg, Sawin and Speyer, Norin and Pebody, is proved following
      Kleinberg, Sawin and Speyer and Pebody; see those sources.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The growth rate of tri-colored sum-free sets"
    authors:
      - "Robert Kleinberg"
      - "Will Sawin"
      - "David E. Speyer"
    id: "arXiv:1607.00047"
    type: "paper"
    location: "The upper bound on multicolored sum-free sets, Lemma 3.1 and Section 4"
    relationship: "adapts"
    note: >-
      Theorem 2 of Fox and Lovász is cited from this paper. For the upper bound, the Lean proof
      writes the indicator of u + v + w = 0 in F_p^n as a sum of products of monomials of degree
      at most (p - 1)n, bounds the slice rank of the diagonal tensor by Tao's lemma, counts the
      monomials of degree at most (p - 1)n/3 by Chernoff's bound with a parameter 0 < x < 1, and
      removes the constant factor by taking tensor powers. For the lower bound, it follows the
      construction of Section 4: a coupling of three geometric distributions of mean (p - 1)/3,
      given by Pebody's theorem, is rounded to a base point; the triples of the type classes of
      its coordinates summing to the all p - 1 vector are hashed into Z/PZ for a prime P from
      Bertrand's postulate, and the triples whose hashes lie in a set without three-term
      progressions from Behrend's construction and share no vector with another such triple
      form the family. The size of a type class is bounded below as in Lemma 3.1, by comparing
      it with the cross entropy of the geometric distribution and a Stirling bound. The Lean
      proof works with any p ≥ 2, and pads the family by zero coordinates to reach every large
      dimension.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Proof of a conjecture of Kleinberg, Sawin and Speyer"
    authors:
      - "Luke Pebody"
    id: "arXiv:1608.05740"
    type: "paper"
    location: "Theorem 4, Lemma 2.1, Lemma 3.1, Corollary 3.2 and Section 5"
    relationship: "formalizes"
    note: >-
      Pebody's theorem says that three decreasing mass functions on [0, N] with equal masses
      whose means sum to N are the marginals of a nonnegative function on the triples of natural
      numbers with sum N. The Lean proof follows Pebody's induction on N: decreasing mass
      functions are nonnegative combinations of uniform distributions, balanced weights
      decompose into simple triples, and the simple triples are handled by peeling off the layer
      where the first variable vanishes or by the case analysis of Section 5.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets, ZMod p, Module, Fintype.card, Real.rpow, Real.logb and
      Real.sqrt from Mathlib. The proofs use its multivariate polynomials, matrix rank, linear
      maps between finite vector spaces, Jensen's inequality for concave functions, the weighted
      arithmetic-geometric mean inequality, and double counting. Mathlib has none of the
      theorems of the sources.

status:
  scope: >-
    The project proves Theorems 1, 2 and 3 of Fox and Lovász in Fin n → ZMod p and in every
    finite vector space over ZMod p, Lemma 5 in a form that holds for every degree bound, the
    construction of Section 3 with the inequality between ε, δ and the size of a multicolored
    sum-free family that it gives, the second part of Theorem 2 (multicolored sum-free families
    of size p^((1 - c_p - o(1))n) exist), which the paper cites from Kleinberg, Sawin and
    Speyer, Norin and Pebody, the asymptotic upper bound δ ≤ ε^(C_p - o(1)) of Section 3, and
    the values of c_2 and c_3. The sorry counts refer to the library and
    ArithmeticTriangleRemovalInVectorSpacesPalomar/Solution.lean;
    ArithmeticTriangleRemovalInVectorSpacesPalomar/Challenge.lean has thirteen placeholders, one
    for each statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib and a shell. The agent read the LaTeX source of the paper, wrote the
        definitions, the statements and the proofs, checked them with the Lean compiler, and
        wrote Challenge.lean, Solution.lean, the README and this file.
      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        One instruction to formalize the main results of the paper for submission to Palomar,
        following the maintainer's Lean style guide.
  spend_usd: "not tracked"
  notes: >-
    Claude Code wrote the Lean code, the README and this file at the request of Gabriel Dahia.
    The agent chose the random linear map in Lemma 5, the potential minimization in place of
    Lemma 6, and the proofs of the values of c_2 and c_3 by the weighted arithmetic-geometric
    mean inequality. Every proof is checked by Lean.

fidelity:
  divergences: >-
    Theorem 1 assumes 0 ≤ ε in place of 0 < ε < 1, and bounds the number of removed elements by
    εN. Theorem 3 allows X, Y and Z to contain more than the vertices of the m triangles, which
    are given as injective functions x, y and z from a finite type with x i + y i + z i = 0.
    The second part of Theorem 2 is stated for every p ≥ 2, prime or not, as: for every η > 0
    and every large n there is a multicolored sum-free family in Fin n → ZMod p of at least
    p^((1 - c_p - η)n) triples. The bound δ ≤ ε^(C_p - o(1)) of Section 3 is stated as: for
    every η > 0 there is ε₀ > 0 such that for 0 < ε < ε₀, any δ that works with ε for every n
    satisfies δ ≤ ε^(C_p - η).
    The project also proves the two claims of Section 3 about X × F_p^l, Y × F_p^l and
    Z × F_p^l, and the inequality δN² ≤ m for any multicolored sum-free family of m > εN
    triples when the removal lemma holds with ε and δ.
    The value of c_3 is stated for any a with a = (√33 - 1)/8, and logarithms are natural
    logarithms, as their ratio does not depend on the base.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

